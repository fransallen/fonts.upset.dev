name: Create docker image & deploy to Swarm

on:
  push:
    branches:
      - "main"

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GITHUB_TAG env to be used as versioning
        id: env
        run: |
          echo "GITHUB_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: docker build and push to ghcr.io
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            "GITHUB_TAG=${{ steps.env.outputs.GITHUB_TAG }}"

      - name: Deploy to Swarm
        run: |
          curl -sSf -X POST "${{ secrets.DOCKER_SWARM_WEBHOOK_URL1 }}"
          curl -sSf -X POST "${{ secrets.DOCKER_SWARM_WEBHOOK_URL2 }}"
